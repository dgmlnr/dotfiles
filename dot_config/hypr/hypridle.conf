# Idle daemon — https://wiki.hyprland.org/Hypr-Ecosystem/hypridle/
general {
    # The wrapper wakes the primary output before locking — hyprlock crashes if it
    # starts on a dpms-off panel. `pidof` guards against stacking two lockers.
    lock_cmd = pidof hyprlock || $HOME/.config/hypr/scripts/lock.sh
    before_sleep_cmd = loginctl lock-session # lock before suspend
    after_sleep_cmd = hyprctl dispatch dpms on
}

# No idle listeners: the session never locks or blanks on inactivity, by choice.
# hypridle still runs for the sleep hooks above (lock before suspend, wake the
# outputs after resume), which are suspend-driven, not idle-driven.
#
# The removed timeline was: 300s -> loginctl lock-session, 360s -> idle-dpms.sh
# off/on. Restore those two listeners to bring idle lock and screen-off back.
