# Idle daemon — https://wiki.hyprland.org/Hypr-Ecosystem/hypridle/
general {
    lock_cmd = pidof hyprlock || $HOME/.config/hypr/scripts/lock.sh   # wrapper: wakes DP-3 first (avoids hyprlock crash on dpms-off panel); avoids double-lockers
    before_sleep_cmd = loginctl lock-session # lock before suspend
    after_sleep_cmd = hyprctl dispatch dpms on
}

# Dim/lock/screen-off timeline (seconds)
listener {
    timeout = 300                            # 5 min -> lock
    on-timeout = loginctl lock-session
}

listener {
    timeout = 360                            # 6 min -> screen off
    on-timeout = $HOME/.config/hypr/scripts/idle-dpms.sh off   # guard: skip dpms-off while hyprlock is up (crash on this AMD)
    on-resume = $HOME/.config/hypr/scripts/idle-dpms.sh on
}
