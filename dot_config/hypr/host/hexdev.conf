# ┌─────────────────────────────────────────────────────────────┐
# │ Host: hexdev — work desktop                                   │
# │ AMD Polaris (RX 470/580) · remote-access SERVER (VNC+Sunshine)│
# └─────────────────────────────────────────────────────────────┘
#
# Sourced at the END of hyprland.conf, so everything here overrides the common
# core. Only put things here that are false or harmful on other machines.

###################
### MONITORS    ###
###################
# Pin the physical panel at the origin so the moonlight headless (at 3000x0) keeps
# a real gap (1600..3000) -> cursor cannot wander into the capture area.
monitor = DP-3, preferred, 0x0, 1
# Persistent position for the Moonlight headless: keep it far off-screen (gap from
# DP-3's 0..1600 makes the cursor unable to wander in). Overrides the catch-all
# in the common core.
monitor = moonlight, 1920x1080@60, 3000x0, 1

#############################
### ENVIRONMENT VARIABLES ###
#############################
# AMD Polaris (RX 470/580) + aquamarine: disable GBM modifiers to fix
# "GBM: Allocating with modifiers failed" / black screen / page-flip errors.
# HOST-ONLY: on Intel i915 this forces linear buffers and loses compression and
# tiling, so it must never reach the laptop.
env = AQ_NO_MODIFIERS,1

#################
### AUTOSTART ###
#################
# Lock the session immediately on start. Pairs with LightDM autologin: the
# password gate becomes hyprlock (reachable locally AND over VNC), so a reboot
# leaves the machine locked-but-VNC-reachable instead of stuck at the greeter.
#
# The persistent Moonlight headless MUST be created BEFORE hyprlock locks (creating
# an output under an active lock crashes hyprlock), and exec-once does not await
# completion — so chain them in ONE command to guarantee order: init, THEN lock.
exec-once = bash -c '$HOME/.config/hypr/scripts/moonlight-display.sh init; hyprlock'

# KWallet (KF6): credential store for KDE apps that don't speak Secret Service.
# Smb4K stores SMB share passwords here (it talks to org.kde.kwalletd6, not
# org.freedesktop.secrets), so KeePassXC can't cover it. Dbus-activates on demand
# too, but starting it explicitly keeps the unlock predictable at session start.
exec-once = kwalletd6

# hypridle disabled ON PURPOSE on this host: this box is the remote-access
# server, and an idle timeout that locks or blanks it makes it unreachable or
# kills a live stream. Manual lock is still available via SUPER+Escape.
# The laptop enables hypridle instead — see host/hexdev-home.conf.
# exec-once = hypridle

# Remote desktop (VNC) — shares the live Hyprland session. Listens on :5900
# with TLS + password auth (see ~/.config/wayvnc/config). Reach it over the VPN.
# No --render-cursor: TigerVNC draws the cursor natively via the RFB cursor
# pseudo-encoding. Adding --render-cursor ALSO bakes a cursor into the frame,
# which stacks a second (black-box) cursor on top. Hardware cursors keep the
# pointer out of the captured framebuffer so only the client-drawn one shows.
# wayvnc-keepalive: respawns wayvnc if it ever dies (so 5900 never stays down and
# you can't reconnect), logging to ~/.local/state/wayvnc.log. Run as a systemd user
# service (Restart=always) so the SUPERVISOR itself is supervised — we only kick it
# off here because graphical-session.target is inactive on this non-uwsm session.
exec-once = systemctl --user start wayvnc-keepalive.service

# Sunshine (Moonlight host): same reason as wayvnc above — the service is
# WantedBy=graphical-session.target, but that target is inactive on this non-uwsm
# session, so it never auto-starts. Kick it off explicitly here.
exec-once = systemctl --user start app-dev.lizardbyte.app.Sunshine.service

# Moonlight display watchdog: same non-uwsm reason as above. Self-heals a stuck
# LOCAL baseline — if no stream is live (zero sunshine UDP) yet the headless is
# holding a physical workspace (1..10), the panel is blanked, or a stale
# moonlight-active flag lingers, it re-asserts baseline via moonlight-display.sh
# off. Confirms idle for 2 ticks before acting; never touches outputs under lock.
exec-once = systemctl --user start moonlight-watchdog.service

# VNC display-mode watcher: on connect, swaps to a virtual 1920x1080 output and
# blanks the physical 1600x900 panel; on disconnect, restores DP-3 (see the
# vnc-mode-*.sh scripts). Panic restore: SUPER+CTRL+SHIFT+P.
#
# DISABLED 10-jun-2026: wayvnc v0.10 capturing a HEADLESS output gets stuck in
# "Pausing frame capture" after the DPMS toggle -> frozen VNC. So VNC now serves
# DP-3 directly at 1600x900 (reliable). Moonlight is the primary remote path.
# Re-enable only after wayvnc is upgraded past v0.10 and headless capture is
# re-tested. To re-enable: uncomment the line below.
# exec-once = $HOME/.config/hypr/scripts/vnc-watch.sh

# Always-on Remote Control Claude session: reachable from the phone via the
# claude.ai cloud (no VPN needed). Lives hidden in its own special workspace
# (window rule in the common core). Uses bypass permissions per settings.json
# defaultMode.
#
# NOTE: both hosts now run this under claude-remote.service (Restart=always),
# the supervised form. The unit is load-bearing, not a nicety: the script's
# watchdog kills claude when the cloud bridge never comes up, and only
# Restart=always brings it back. Starting the unit here rather than enabling it
# keeps Hyprland in charge of the ordering — default.target could fire before
# the compositor is up, with no WAYLAND_DISPLAY to launch ghostty into.
exec-once = systemctl --user start claude-remote.service

# Thunderbird: autostart into its own workspace 10 (window rule in the common core).
exec-once = thunderbird

###################
### KEYBINDINGS ###
###################
# Panic: force-restore the physical panel if a VNC drop left it blanked.
# HOST-ONLY: panic-restore.sh is meaningless on a machine with no VNC server.
bindd = $mainMod CTRL SHIFT, P, Restaurar pantalla física (pánico VNC), exec, $HOME/.config/hypr/scripts/panic-restore.sh
