# hexdev-home — Intel 4th Gen integrated graphics (HD 4600).

# The cursor shader animation loop pinned the HD 4600 at 1150 MHz whenever
# this terminal had focus. "false" renders the shader only on updates.
#
# This is a property of the iGPU, not a preference: hexdev has a discrete
# Radeon and runs the same shader continuously without the clock penalty,
# which is why this belongs here and not in the shared config.
custom-shader-animation = false
