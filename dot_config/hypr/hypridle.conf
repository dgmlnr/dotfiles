# Idle daemon — https://wiki.hyprland.org/Hypr-Ecosystem/hypridle/
general {
    # The wrapper wakes the primary output before locking — hyprlock crashes if it
    # starts on a dpms-off panel. `pidof` guards against stacking two lockers.
    lock_cmd = pidof hyprlock || $HOME/.config/hypr/scripts/lock.sh
    before_sleep_cmd = loginctl lock-session # lock before suspend
    after_sleep_cmd = hyprctl dispatch dpms on
}

# Dim/lock/screen-off timeline (seconds)
listener {
    timeout = 300                            # 5 min -> lock
    on-timeout = loginctl lock-session
}

listener {
    timeout = 360                            # 6 min -> screen off
    # idle-dpms.sh blanks every real output and skips the whole thing while hyprlock
    # is up, which is what used to crash the compositor.
    on-timeout = $HOME/.config/hypr/scripts/idle-dpms.sh off
    on-resume = $HOME/.config/hypr/scripts/idle-dpms.sh on
}
